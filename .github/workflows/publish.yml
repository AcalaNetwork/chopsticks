name: Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          executor/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2022-10-30
        components: rustfmt
        target: wasm32-unknown-unknown
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org/
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - run: bun install --frozen-lockfile
    - run: bun run check
    - run: bun run build

    # version containing a hyphen, publish as beta, i.e: 1.0.0-1
    - run: |
        if npm pkg get version --workspace @acala-network/chopsticks | jq '."@acala-network/chopsticks"' | grep '-'; then TAG='--tag beta'; fi
        echo "NPM_TAG=$TAG" >> $GITHUB_ENV

    # Note: Using OIDC (Trusted Publishing) - no NPM_AUTH_TOKEN needed for publish
    # Configure trusted publisher at: https://www.npmjs.com/settings/<org-or-user>/packages

    # Note: OIDC authentication is used automatically via Trusted Publishing
    # No NPM_AUTH_TOKEN needed - npm CLI detects OIDC environment and uses it
    - name: Publish packages
      run: |
        publish_workspace() {
          PACKAGE="$1"
          WORKSPACE="$2"
          VERSION="$(npm pkg get version --workspace "$PACKAGE" | jq -r 'to_entries[0].value')"

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published"
            return
          fi

          TARBALL="$(cd "$WORKSPACE" && bun pm pack --quiet --ignore-scripts --destination "$RUNNER_TEMP" | tail -n 1)"
          npm publish "$TARBALL" --access public $NPM_TAG
        }

        publish_workspace @acala-network/chopsticks-executor executor
        publish_workspace @acala-network/chopsticks-core packages/core
        publish_workspace @acala-network/chopsticks-db packages/db
        publish_workspace @acala-network/chopsticks packages/chopsticks
        publish_workspace @acala-network/chopsticks-testing packages/testing
        publish_workspace @acala-network/chopsticks-utils packages/utils

    - name: Login to Docker Hub
      uses: docker/login-action@v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: acala/${{ github.event.repository.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha
          type=sha,format=long
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
